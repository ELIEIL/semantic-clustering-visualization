<!DOCTYPE html>
<html lang="en" style="background: black;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Display</title>
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body style="background: black;">
    <!-- Hamburger menu removed - use control-panel.html instead -->
    
    <!-- Left-aligned Headline Display -->
    <div id="headlineDisplay" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: left; z-index: 100; pointer-events: none; max-width: 700px; padding: 40px; background: black; border: 2px solid white;">
        <h1 id="headlineText" style="color: white; font-size: 48px; font-weight: 300; margin: 0 0 15px 0; line-height: 1.3; letter-spacing: -0.5px;">News headline</h1>
        <p id="headlineTimestamp" style="color: rgba(255, 255, 255, 0.6); font-size: 16px; margin: 0; font-weight: 400;">Updated 5:38 AM EST, Fri March 6, 2026</p>
    </div>
    
    <!-- Control panel removed - use control-panel.html instead -->
    
    <div id="loading" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; color: white;">
        Loading visualization...
    </div>
    
    <!-- Removed: Generate Theme button -->
    
    <style>
        .db-option:hover {
            background: #f5f5f5 !important;
        }
        .db-option.active {
            background: #e3f2fd !important;
        }
    </style>
    
    <script>
        // Control panel removed - all controls now in control-panel.html
        // This display only shows the visualization
        
        // Check if p5.js loads
        window.addEventListener('load', () => {
            const loadingDiv = document.getElementById('loading');
            if (typeof p5 !== 'undefined') {
                console.log('p5.js loaded successfully');
                loadingDiv.textContent = 'p5.js loaded. Initializing...';
            } else {
                console.error('p5.js failed to load');
                loadingDiv.textContent = 'ERROR: p5.js failed to load';
                loadingDiv.style.color = 'red';
            }
        });
    </script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js" crossorigin="anonymous"></script>
<script src="../../script.js" defer></script>

<!-- Mobile URL fetch removed - now in control-panel.html -->
</body>
</html>

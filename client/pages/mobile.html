<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Controller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet">
    <link rel="stylesheet" href="../styles/mobile.css">
    <link rel="stylesheet" href="../styles/onboarding.css">
</head>
<body>
    <!-- Main Content Container -->
    <div class="mobile-container">
        
        <!-- Input Section -->
        <div id="inputSection" class="input-section">
            <textarea 
                id="textInput" 
                class="opinion-input" 
                placeholder="Whats your opinion?"
                maxlength="500"
                autocomplete="off"
            ></textarea>
            <div class="bottom-controls">
                <div id="countdown" class="countdown-timer">03:00</div>
                <button id="submitBtn" class="submit-btn">Submit</button>
            </div>
        </div>
        
        <!-- Cluster Results Section (shown after timer ends) -->
        <div id="clusterSection" class="cluster-section" style="display: none;">
            <div class="cluster-header">
                <h1>Generated Topics</h1>
                <p class="cluster-subtitle">Vote on a topic you'd like to discuss</p>
            </div>
            
            <div id="clusterList" class="cluster-list">
                <!-- Clusters will be dynamically inserted here -->
            </div>
        </div>
        
    </div>
    
    <script src="../mobile.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Controller</title>
    <link rel="stylesheet" href="../styles/mobile.css">
</head>
<body>
    <!-- Header with Submit Button -->
    <header class="mobile-header">
        <button id="submitBtn" class="submit-btn-header">Submit</button>
    </header>
    
    <!-- Main Content Container -->
    <div class="mobile-container">
        
        <!-- Headline Section -->
        <div class="headline-section">
            <h2 id="mobileHeadline" class="mobile-headline">News headline</h2>
            <p id="mobileTimestamp" class="mobile-timestamp">Updated 5:38 AM EST, Fri March 6, 2026</p>
        </div>
        
        <!-- Input Section -->
        <div class="input-section">
            <textarea 
                id="textInput" 
                class="opinion-input" 
                placeholder="Whats your opinion?"
                maxlength="500"
                autocomplete="off"
            ></textarea>
        </div>
        
    </div>
    
    <script src="../mobile.js"></script>
</body>
</html>
